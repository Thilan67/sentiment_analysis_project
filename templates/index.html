<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>App</title>
    <style>
        * {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f9;
        }

        .split {
          height: 100%;
          width: 50%;
          position: fixed;
          z-index: 1;
          top: 0;
          overflow-x: hidden;
          padding-top: 20px;
        }

        .left {
          left: 0;
          background: linear-gradient(160deg, #6a11cb 0%, #2575fc 100%);
        }

        .right {
          right: 0;
          overflow-y: auto;
        }

        .centered {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          text-align: center;
          width: 80%;
        }

        .centered img {
          width: 100%;
          border-radius: 16px;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .sentiment-card {
          background: #ffffff;
          border-radius: 16px;
          padding: 32px 36px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .sentiment-card h2 {
          font-weight: 600;
          color: #2b2d42;
          margin-bottom: 24px;
        }

        .sentiment-stats {
          display: flex;
          gap: 16px;
          margin-bottom: 24px;
        }

        .stat-pill {
          flex: 1;
          border-radius: 12px;
          padding: 16px;
          text-align: center;
          font-weight: 600;
          font-size: 15px;
        }

        .stat-pill.positive {
          background: #e7f8ee;
          color: #1e8e51;
          border: 1px solid #b7ecc9;
        }

        .stat-pill.negative {
          background: #fdecec;
          color: #d1392b;
          border: 1px solid #f6c3bf;
        }

        .stat-pill span {
          display: block;
          font-size: 22px;
          margin-top: 4px;
        }

        textarea {
          width: 100%;
          height: 100px;
          padding: 12px 16px;
          border: 2px solid #e1e4e8;
          border-radius: 10px;
          background-color: #f8f9fb;
          font-size: 15px;
          resize: none;
          transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
          outline: none;
          border-color: #2575fc;
          box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.15);
          background-color: #fff;
        }

        input[type="submit"] {
          margin-top: 12px;
          border: none;
          background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
          color: #fff;
          font-weight: 600;
          padding: 10px 28px;
          border-radius: 8px;
          cursor: pointer;
          transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="submit"]:hover {
          transform: translateY(-1px);
          box-shadow: 0 6px 16px rgba(37, 117, 252, 0.35);
        }

        input[type="submit"]:active {
          transform: translateY(0);
        }

        label {
          font-weight: 500;
          color: #444;
        }

        .coment-bottom {
          margin-top: 28px;
          border-radius: 14px;
          box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06) !important;
        }

        .coment-bottom hr {
          border: none;
          border-top: 1px solid #eee;
        }

        .commented-section {
          padding: 6px 4px;
        }

        .commented-section span {
          white-space: normal;
          word-break: break-word;
          color: #333;
          font-size: 14.5px;
          line-height: 1.5;
        }

        .comments {
          text-decoration: underline;
          text-underline-position: under;
          cursor: pointer;
          color: #2575fc;
        }

        @media (max-width: 768px) {
          .split {
            position: relative;
            width: 100%;
            height: auto;
          }

          .left {
            height: 260px;
          }

          .centered {
            width: 60%;
          }

          .right {
            padding-bottom: 40px;
          }
        }
    </style>
</head>
<body>

    <div class="split left">
        <div class="centered">
            <img src="../static/products/prod1.jpg" alt="">
        </div>
    </div>


    <div class="split right">
        <div class="container mt-5 mb-5">
            <div class="d-flex justify-content-center row">
                <div class="d-flex flex-column col-md-8">

                    <div class="sentiment-card">
                        <h2>Sentiment Overview</h2>

                        <div class="sentiment-stats">
                            <div class="stat-pill positive">
                                Positive
                                <span>{{ data.positive }}</span>
                            </div>
                            <div class="stat-pill negative">
                                Negative
                                <span>{{ data.negative }}</span>
                            </div>
                        </div>

                        <form method="post">
                          <textarea name="text" placeholder="Write your review here..."></textarea>
                          <input type="submit" value="Submit">
                        </form>
                    </div>

                    <div class="coment-bottom bg-white p-2 px-4">
                        {% for review in data.reviews %}
                        <hr/>
                          <div
                              class="commented-section mt-2">
                              <div class="d-flex flex-row align-items-center commented-user">
                                  </div>
                                  <div class="text-nowrap bd-highlight"><span>{{ review }}</span></div>
                                  <hr/>
                        {% endfor %}
                      </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
